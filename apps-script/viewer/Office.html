<style>

</style>
<script>
/* LinkedIn Review — Agent Office tab. Three.js 0.170 (ES modules from jsDelivr, loaded the
   first time the tab opens) renders an office where the orchestrator and four subagents
   replay one /linkedin-review run from its stats file: who works when, what each tool call
   was (kind + website host or file name only), tokens and approximate cost.
   The app calls LROffice.view() for the tab's markup, then attach() / detach(). */
(function(){
const CDN = "https://cdn.jsdelivr.net/npm/three@0.170.0/";

// Agent goals and descriptions shown in the agent card. Update when an agent's scope changes.
const META = {
  order: ["scraper", "recruiter", "career-coach", "synthesis", "orchestrator"],
  agents: {
    scraper: { name: "Scraper", step: "1 · Collect", color: "#2aa7b8",
      goal: "Read the LinkedIn profile and save it as structured JSON, without filling any gaps.",
      description: "Drives Claude in Chrome in a fresh tab, expands every section, extracts headline, About, experience, skills and posts, and records what it could not see so downstream agents never guess.",
      inputs: "Profile URL, previous scrape", outputs: "profile JSON with missing_fields", scope: "Facts only" },
    recruiter: { name: "Recruiter", step: "2a · Short term", color: "#f08a3c",
      goal: "Find what to change in the next 1–12 months to get more and better interviews.",
      description: "Scores the profile like a senior technical recruiter: skill gaps, keywords, header and About, experience, certifications, salary research, and paste-ready profile changes. Cites every market claim.",
      inputs: "profile JSON, web research", outputs: "recruiter.json", scope: "1–12 months" },
    "career-coach": { name: "Career Coach", step: "2b · Long term", color: "#8b6cf0",
      goal: "Set the 2–3 year direction: industry, target role, country and track.",
      description: "Builds a long-horizon strategy grounded in the WEF Future of Jobs report and BLS data: compares countries, company sizes and IC versus management, with a SWOT and a skip-for-now list. Never touches LinkedIn copy.",
      inputs: "profile JSON, WEF and BLS pages", outputs: "career_coach.json", scope: "2–3 years" },
    synthesis: { name: "Synthesis", step: "3 · Merge", color: "#e4577a",
      goal: "Merge both reviews into one run document the web app can render.",
      description: "Combines recruiter and coach output into the schema v2 run: summary, snapshot, plan and what changed since the last run. It only merges; it never scrapes, re-runs agents or invents findings.",
      inputs: "recruiter.json, career_coach.json", outputs: "run JSON (schema v2)", scope: "Merge only" },
    orchestrator: { name: "Orchestrator", step: "0 · Conduct", color: "#d9a400",
      goal: "Run the whole pipeline from one command and publish the result.",
      description: "The main Claude Code session behind /linkedin-review: starts the run, launches each subagent (recruiter and coach in parallel), checks their output, validates the run, publishes it and reports back.",
      inputs: "/linkedin-review", outputs: "published run", scope: "Coordination" },
  },
  pipeline: [
    { id: "scraper", label: "Scraper" },
    { id: "recruiter", label: "Recruiter", parallel: "career-coach" },
    { id: "synthesis", label: "Synthesis" },
    { id: "publish", label: "Publish" },
  ],
};
const ROWS = ["orchestrator", "scraper", "recruiter", "career-coach", "synthesis"];
const LOOP_S = 40;      // one run replayed in this many seconds
const HOLD_S = 4;       // pause at the end of each loop
const TYPES = [
  ["input", "Input", "var(--of-input)"],
  ["cache_write", "Cache write", "var(--of-write)"],
  ["cache_read", "Cache read", "var(--of-read)"],
  ["output", "Output", "var(--of-output)"],
];
const EDGES = [
  ["scraper", "recruiter"], ["scraper", "career-coach"],
  ["recruiter", "synthesis"], ["career-coach", "synthesis"],
  ["synthesis", "orchestrator"],
];
const ORDERS = {
  scraper: "Scraper, pull the profile.",
  recruiter: "Recruiter, short-term review.",
  "career-coach": "Coach, long-term plan.",
  synthesis: "Synthesis, merge both.",
  publish: "Validated. Publishing!",
};
// tool events are [offset_s, kind, detail?]; detail is at most a website host or a file name
const PHRASES = {
  search: () => "Searching the web…",
  fetch: (d) => (d ? `Reading ${d}` : "Reading a web page"),
  browse: (d) => (d ? `Opening ${d}` : "Opening a page"),
  click: () => "Clicking through the page",
  readpage: () => "Reading the page",
  script: () => "Extracting page data",
  tab: () => "Opening a browser tab",
  write: (d) => (d ? `Writing ${d}` : "Writing a file"),
  edit: (d) => (d ? `Editing ${d}` : "Editing a file"),
  read: (d) => (d ? `Reading ${d}` : "Reading a file"),
  bash: () => "Running a check",
  validate: () => "Validating the run",
  publish: () => "Publishing to the app",
  start: () => "Starting a new run",
  stats: () => "Saving the stats",
  handback: () => "Done, handing back",
  tool: () => "Using a tool",
};
const WEB = new Set(["search", "fetch", "browse"]);
const FILES = new Set(["write", "edit", "read"]);

const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTok = (n) => (n == null ? "—" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + "K" : String(Math.round(n)));
const fmtUsd = (n) => (n == null ? "—" : "~$" + (n < 0.1 ? n.toFixed(3) : n.toFixed(2)));
const fmtDur = (s) => (s == null ? "—" : Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0"));
const fmtDay = (iso) => { try { return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); } catch (e) { return iso; } };
const fmtWhen = (iso) => { try { return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } };
const nameOf = (id) => META.agents[id].name;
const colorOf = (id) => META.agents[id].color;

// ---- scene (robots.js + office.js), built once the libraries arrive --------------------------
let scenePromise = null;
function loadScene() {
  return scenePromise || (scenePromise = (async () => {
    const ex = (p) => import(CDN + "examples/jsm/" + p + ".js/+esm");
    const [THREE, { OrbitControls }, { RoundedBoxGeometry }, { RoomEnvironment }, { EffectComposer }, { RenderPass }, { GTAOPass }, { OutputPass }] = await Promise.all([
      import(CDN + "+esm"), ex("controls/OrbitControls"), ex("geometries/RoundedBoxGeometry"), ex("environments/RoomEnvironment"),
      ex("postprocessing/EffectComposer"), ex("postprocessing/RenderPass"), ex("postprocessing/GTAOPass"), ex("postprocessing/OutputPass"),
    ]);

    // ---- robots ----
    const { makeRobot } = (() => {
      // Toy robots in a soft clay style: big rounded head with a screen face,
      // small accent-coloured body, short legs. Same bone layout as a person
      // (shoulder > upper > fore > hand) so arms can type with two-bone IK.

      const std = (color, roughness = 0.45, extra = {}) =>
        new THREE.MeshStandardMaterial({ color, roughness, metalness: 0, ...extra });
      function mesh(geo, mat, shadow = true) {
        const m = new THREE.Mesh(geo, mat);
        m.castShadow = shadow;
        m.receiveShadow = true;
        return m;
      }
      const rbox = (w, h, d, r, mat) => mesh(new RoundedBoxGeometry(w, h, d, 5, Math.min(r, w / 2, h / 2, d / 2)), mat);
      const sph = (r, mat) => mesh(new THREE.SphereGeometry(r, 28, 20), mat);
      function limb(r1, r2, len, mat) {
        const g = new THREE.CylinderGeometry(r2, r1, len, 24, 1);
        g.translate(0, -len / 2, 0);
        return mesh(g, mat);
      }

      const L1 = 0.19, L2 = 0.16, HAND = 0.045;
      const SEAT_HIPS = 0.565;   // hips height when seated on a chair (seat top 0.5)
      const STAND_HIPS = 0.485; // feet just touch the floor

      /**
       * opts: { accent, antenna: 'ball'|'twin'|'dish'|'ears'|'visor', scale, tie }
       */
      function makeRobot(opts) {
        const accent = new THREE.Color(opts.accent);
        const M = {
          shell: std(0xf4f5f3, 0.38),
          joint: std(0xdfe4e8, 0.45),
          dark: std(0x2b3139, 0.35),
          body: std(accent.clone().lerp(new THREE.Color(0xffffff), 0.05), 0.42, { emissive: accent.clone(), emissiveIntensity: 0 }),
          accent: std(accent, 0.35),
          glow: new THREE.MeshStandardMaterial({ color: accent, emissive: accent, emissiveIntensity: 0.6, roughness: 0.3 }),
          screen: std(0x0d151d, 0.15),
        };
        const root = new THREE.Group();
        const body = new THREE.Group();          // everything above the floor; scaled
        body.scale.setScalar(opts.scale || 1);
        root.add(body);
        const hips = new THREE.Group();
        hips.position.y = SEAT_HIPS;
        body.add(hips);
        hips.add(Object.assign(rbox(0.3, 0.12, 0.24, 0.06, M.joint), {}));

        const spine = new THREE.Group();
        spine.position.y = 0.06;
        hips.add(spine);
        const torso = rbox(0.36, 0.34, 0.28, 0.12, M.body);
        torso.position.y = 0.19;
        spine.add(torso);
        const belly = rbox(0.2, 0.12, 0.03, 0.03, M.shell);
        belly.position.set(0, 0.15, -0.135);
        spine.add(belly);
        const chestLight = mesh(new THREE.CircleGeometry(0.025, 24), M.glow, false);
        chestLight.position.set(0.09, 0.27, -0.142);
        chestLight.rotation.y = Math.PI;
        spine.add(chestLight);
        const backPack = rbox(0.22, 0.2, 0.06, 0.04, M.shell);
        backPack.position.set(0, 0.2, 0.15);
        spine.add(backPack);
        if (opts.tie) {
          const tie = rbox(0.05, 0.16, 0.015, 0.008, std(opts.tie, 0.4));
          tie.position.set(0, 0.25, -0.143);
          spine.add(tie);
          const collar = rbox(0.16, 0.04, 0.02, 0.01, M.shell);
          collar.position.set(0, 0.34, -0.13);
          spine.add(collar);
        }

        const neckG = new THREE.Group();
        neckG.position.y = 0.36;
        spine.add(neckG);
        const neck = mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.06, 20), M.dark);
        neck.position.y = 0.02;
        neckG.add(neck);
        const head = new THREE.Group();
        head.position.y = 0.22;
        neckG.add(head);
        head.add(rbox(0.44, 0.36, 0.38, 0.14, M.shell));
        const facePlate = rbox(0.36, 0.25, 0.03, 0.08, M.screen);
        facePlate.position.set(0, -0.005, -0.185);
        head.add(facePlate);
        const faceCv = document.createElement('canvas');
        faceCv.width = 256; faceCv.height = 176;
        const faceTex = new THREE.CanvasTexture(faceCv);
        faceTex.colorSpace = THREE.SRGBColorSpace;
        const face = new THREE.Mesh(new THREE.PlaneGeometry(0.33, 0.227), new THREE.MeshBasicMaterial({ map: faceTex, toneMapped: false, transparent: true }));
        face.position.set(0, -0.005, -0.2015);
        face.rotation.y = Math.PI;
        head.add(face);
        for (const s of [-1, 1]) {
          const ear = mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.05, 28), M.accent);
          ear.rotation.z = Math.PI / 2;
          ear.position.set(s * 0.235, 0, 0.0);

      function turnBy(st, err, dt) {
        const max = (3 + 2 * st.vel) * dt;
        const d = THREE.MathUtils.clamp(err, -max, max);
        st.yaw += d;
        st.turnStep += Math.abs(d);
        st.turnSpeed += (Math.abs(d) / Math.max(dt, 1e-3) - st.turnSpeed) * Math.min(1, dt * 10);
        return d;
      }
      const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
      function turnTo(st, yaw, dt) { turnBy(st, wrap(yaw - st.yaw), dt); }
      function stepWalk(st, dt) {
        if (!st.path.length) { st.vel += (0 - st.vel) * Math.min(1, dt * 8); st.headErr = 0; return; }
        if (st.path.length > 1 && st.pos.distanceTo(st.path[0]) < 0.12 + 0.15 * st.vel) st.path.shift(); // round the corner
        const target = st.path[0];
        const dx = target.x - st.pos.x, dz = target.y - st.pos.y;
        const dist = Math.hypot(dx, dz);
        const err = wrap(Math.atan2(-dx, -dz) - st.yaw);
        st.headErr = err;
        turnBy(st, err, dt);
        // slow down when facing away (turn on the spot first) and when arriving
        let vT = st.cruise * Math.pow(Math.max(0, Math.cos(err)), 3);
        const left = remaining(st);
        if (left < 0.8) vT *= Math.max(0.12, left / 0.8);
        st.vel += (vT - st.vel) * Math.min(1, dt * (vT > st.vel ? 3 : 6));
        const step = st.vel * dt;
        st.pos.x -= Math.sin(st.yaw) * step;
        st.pos.y -= Math.cos(st.yaw) * step;
        st.stride += step;
        if (st.path.length === 1 && dist < 0.1) { st.pos.copy(target); st.path.shift(); }
      }
      function walk(st, dt) {
        for (let left = dt; left > 1e-4; left -= 0.03) stepWalk(st, Math.min(0.03, left)); // sub-steps keep steering stable on slow frames
        return st.path.length > 0;
      }
      function gait(st, bot, sit) {
        st.turnSpeed *= 0.9;
        const amp = Math.min(1, st.vel / 0.45 + Math.min(0.7, st.turnSpeed / 2.5));
        const phase = (st.stride / 0.62) * Math.PI * 2 + st.turnStep * 1.8;
        const swing = bot.setGait(sit, phase, amp) * amp;
        bot.spine.rotation.x = (1 - sit) * (0.03 + 0.07 * Math.min(1, st.vel / st.cruise));
        return swing;
      }
      function place(st) {
        st.bot.root.position.set(st.pos.x, FY, st.pos.y);
        st.bot.root.rotation.y = st.yaw;
      }

      function animateTypist(st, t, dt) {
        const b = st.bot;
        // behaviour: finish → one short coffee break in the kitchenette → back to the desk
        st.doneFor = st.state === 'done' ? st.doneFor + dt : 0;
        if (st.state !== 'done') st.hadBreak = false;
        if (st.mode === 'seated' && st.doneFor > 1.0 && !st.hadBreak) {
          st.mode = 'out';
          st.hadBreak = true;
          coffees++;
          st.breakLeft = BREAK_S + Math.random() * 1.5;
          st.path = [st.exit.clone(), ...route(st.exit, DOOR_IN, undefined, KITCHEN_DOOR), st.kitchen.clone()];
          st.cruise = 1.2;
        } else if ((st.mode === 'out' || st.mode === 'break') && (st.state !== 'done' || st.breakLeft <= 0)) {
          st.mode = 'back';
          const leg = inKitchen(st.pos) ? [DOOR_IN.clone(), ...route(DOOR_IN, st.exit, KITCHEN_DOOR)] : route(st.pos, st.exit);
          st.path = [...leg, st.seat.clone()];
          st.cruise = st.state === 'working' ? 1.3 : 1.15;
        }
        let walking = false;
        if (st.mode === 'seated') {
          st.pos.lerp(st.seat, Math.min(1, dt * 6));
          const err = wrap(DESKS[st.id].yaw - st.yaw);
          turnBy(st, err, dt);
          st.vel = 0;
          st.sit += ((Math.abs(err) < 0.35 ? 1 : 0) - st.sit) * Math.min(1, dt * 5);
        } else {
          st.sit += (0 - st.sit) * Math.min(1, dt * 5);
          if (st.sit < 0.2) walking = walk(st, dt);
          if (!walking && st.mode === 'out' && st.sit < 0.2) st.mode = 'break';
          if (!walking && st.mode === 'back' && st.sit < 0.2) st.mode = 'seated';
          if (st.mode === 'break') st.breakLeft -= dt;
          if (st.mode === 'break') turnTo(st, Math.atan2(-(KITCHEN_CENTER.x - st.pos.x), -(KITCHEN_CENTER.y - st.pos.y)), dt);
        }
        const swing = gait(st, b, st.sit);
        place(st);
        const standing = st.mode !== 'seated' || st.sit < 0.9;
        // the chair rolls aside so the robot can step out and back in
        st.chair.position.x += ((standing ? -0.62 : 0) - st.chair.position.x) * Math.min(1, dt * 4);
        st.chair.position.z += ((standing ? 0.95 : 0.74) - st.chair.position.z) * Math.min(1, dt * 4);
        const moving = walking || st.vel > 0.05;
        const away = st.mode !== 'seated';
        st.carryMug.visible = away;
        st.deskMug.visible = !away;

        const working = st.state === 'working';
        if (!away) {
          const leanT = working ? -0.17 : st.state === 'done' ? 0.02 : -0.08;
          st.lean += (leanT - st.lean) * Math.min(1, dt * 3);
          b.spine.rotation.x = st.lean + Math.sin(t * 1.3 + st.phase) * 0.012;
          b.neckG.rotation.x = -st.lean * 0.4 + 0.08 + Math.sin(t * 0.7 + st.phase) * 0.03;
          b.neckG.rotation.y = Math.sin(t * 0.45 + st.phase) * (working ? 0.06 : 0.2);
          st.idleMix += ((working ? 0 : 1) - st.idleMix) * Math.min(1, dt * 2.5);
          const sp = working ? 15 : 6;
          b.arms.forEach((arm, i) => {
            const ph = t * sp + st.phase + i * 1.7;
            tgt.copy(i === 0 ? KEYS_L : KEYS_R);
            if (i === 1) tgt.lerp(BALL, st.idleMix);
            tgt.x += Math.sin(ph * 0.37) * 0.02;
            tgt.y += Math.max(0, Math.sin(ph)) * (working ? 0.014 : 0.004);
            st.group.localToWorld(tgt);
            arm.shoulder.rotation.y = arm.s * 0.25;
            b.reach(arm, tgt, -0.15);
            arm.fingers.forEach((f, k) => (f.rotation.x = -0.3 - Math.max(0, Math.sin(t * (working ? 17 : 5) + k * 2.1 + i)) * (working ? 0.6 : 0.15)));
          });
          b.drawFace(working ? 'work' : st.state === 'done' ? 'done' : 'wait', t);
        } else {
          b.neckG.rotation.x = moving ? 0.06 + Math.abs(swing) * 0.03 : 0.02 + Math.sin(t * 1.4 + st.phase) * 0.04;
          b.neckG.rotation.y = st.mode === 'break' && !moving ? Math.sin(t * 0.6 + st.phase) * 0.3 : THREE.MathUtils.clamp(st.headErr * 0.6, -0.5, 0.5);
          const sip = st.mode === 'break' && Math.sin(t * 0.8 + st.phase) > 0.75 ? 1 : 0;
          st.carryMug.position.lerp(sip ? mugHigh : mugLow, Math.min(1, dt * 4));
          const [left, right] = b.arms;
          right.shoulder.rotation.y = 0.3;
          st.carryMug.getWorldPosition(tgt);
          tgt.y -= 0.02;
          b.reach(right, tgt, 0.2);
          left.shoulder.rotation.y = 0;
          b.setArm(left, 0.1 - swing * 0.45, 0.3 + Math.max(0, swing) * 0.25, 0);
          b.drawFace(moving ? 'walk' : 'coffee', t);
        }
      }

      function animateBoss(st, t, dt) {
        const b = st.bot;
        if (st.mode !== 'walking' && st.mode !== 'brief' && st.queue.length) {
          const target = st.queue.shift();
          st.target = target === 'publish' ? null : target;
          st.path = route(st.pos, target === 'publish' ? HOME : stations[target].brief);
          st.mode = 'walking';
        }
        let walking = false;
        if (st.mode === 'walking') {
          walking = walk(st, dt);
          if (!walking) {
            if (st.target) { st.mode = 'brief'; st.briefUntil = t + 2.6; }
            else st.mode = 'home';
          }
        } else if (st.mode === 'brief') {
          const seat = stations[st.target].pos;
          turnTo(st, Math.atan2(-(seat.x - st.pos.x), -(seat.y - st.pos.y)), dt);
          if (t > st.briefUntil) {
            st.target = null;
            if (!st.queue.length) { st.path = route(st.pos, HOME); st.mode = 'walking'; } else st.mode = 'home';
          }
        } else {
          turnTo(st, Math.atan2(-(C.x - st.pos.x), -(C.z - st.pos.y)) + Math.sin(t * 0.25) * 0.3, dt * 0.5);
        }
        const swing = gait(st, b, 0);
        place(st);
        const moving = walking || st.vel > 0.05;
        const briefing = st.mode === 'brief';
        b.neckG.rotation.x = briefing ? 0 : moving ? 0.05 + Math.abs(swing) * 0.03 : 0.25 + Math.sin(t * 0.6) * 0.1;
        b.neckG.rotation.y = briefing ? Math.sin(t * 2) * 0.08 : moving ? THREE.MathUtils.clamp(st.headErr * 0.6, -0.5, 0.5) : Math.sin(t * 0.5) * 0.2;
        const [left, right] = b.arms;
        tablet.getWorldPosition(tgt);
        left.shoulder.rotation.y = -0.3;
        b.reach(left, tgt.add(new THREE.Vector3(0, -0.06, 0)), 0.3);
        right.shoulder.rotation.y = briefing ? 0 : 0.25;
        if (briefing) {
          b.setArm(right, 1.45 + Math.sin(t * 5) * 0.12, 0.25, 0.1);
          right.fingers.forEach((f, k) => (f.rotation.x = k ? -1.2 : 0));
        } else if (moving) {
          b.setArm(right, 0.1 + swing * 0.45, 0.3 + Math.max(0, -swing) * 0.25, 0);
        } else {
          tablet.getWorldPosition(tgt);
          b.reach(right, tgt.add(new THREE.Vector3(0, -0.03 + Math.max(0, Math.sin(t * 6)) * 0.03, 0)), 0.2);
          right.fingers.forEach((f) => (f.rotation.x = -0.3));
        }
        b.drawFace(briefing ? 'talk' : moving ? 'walk' : st.state === 'working' ? 'work' : 'wait', t);
      }

      // ---- loop -----------------------------------------------------------------------------------
      let last = performance.now() / 1000, screenClock = 0, clockT = 0, onFrame = null, running = true, raf = 0;
      function frame() {
        if (!running) return;
        raf = requestAnimationFrame(frame);
        const now = performance.now() / 1000;
        const rawDt = Math.min(0.6, now - last); // behaviour uses real time so robots keep pace on slow frames
        const dt = Math.min(0.05, rawDt);
        last = now;
        const t = now;
        const mo = reduceMotion ? 0.25 : 1;

        const bob = Math.sin(t * 0.8) * 0.08 * mo;
        world.position.y = bob;
        shadowPlane.scale.setScalar(1 - bob * 0.25);

        world.updateMatrixWorld();
        for (const st of Object.values(stations)) {
          const working = st.state === 'working';
          st.hot += ((hoverId === st.id || selectedId === st.id ? 1 : 0) - st.hot) * Math.min(1, dt * 10);
          if (st.id === 'orchestrator') animateBoss(st, t, rawDt);
          else {
            animateTypist(st, t, rawDt);
            st.steam.forEach((s) => {
              const p = (t * 0.35 + s.userData.phase) % 1;
              s.position.set(Math.sin(p * 7 + s.userData.phase * 9) * 0.025, 0.12 + p * 0.28, 0);
              s.material.opacity = (1 - p) * 0.45;
              s.scale.setScalar(0.6 + p * 1.4);
            });
            st.lampMat.emissiveIntensity = working ? 1.1 + Math.sin(t * 5) * 0.25 : dark ? 0.8 : 0.05;
          }
          st.bot.bodyMat.emissiveIntensity = st.hot * 0.3;
          st.bot.glowMat.emissiveIntensity = working ? 0.9 + Math.sin(t * 6) * 0.5 : 0.35;
          const op = Math.min(0.85, (working ? 0.5 + Math.sin(t * 4) * 0.18 : 0) + st.hot * 0.4);
          st.ring.material.opacity = op;
          st.ring.visible = op > 0.01;
        }

        const k = 1 - Math.exp(-dt * 4.5);
        if (selectedId && !want.settle) focusTarget(selectedId, want.target); // follow a walking robot
        controls.target.lerp(want.target, k);
        if (want.settle && want.dist) {
          rel.copy(camera.position).sub(controls.target);
          const r = rel.length();
          const nr = r + (want.dist - r) * k;
          if (want.dir) {
            rel.normalize().lerp(want.dir, k).normalize();
            if (rel.angleTo(want.dir) < 0.01) want.dir = null;
          }
          rel.setLength(nr);
          camera.position.copy(controls.target).add(rel);
          if (!want.dir && Math.abs(nr - want.dist) < 0.08 && controls.target.distanceTo(want.target) < 0.05) want.settle = false;
        }
        if (Math.abs(viewOff.x - viewOff.tx) > 0.3 || Math.abs(viewOff.y - viewOff.ty) > 0.3) {
          viewOff.x += (viewOff.tx - viewOff.x) * k;
          viewOff.y += (viewOff.ty - viewOff.y) * k;
          applyViewOffset();
        }
        controls.update();

        const d = new Date();
        const sec = d.getSeconds() + d.getMilliseconds() / 1000;
        hands[2].rotation.z = -(sec / 60) * Math.PI * 2;
        hands[1].rotation.z = -((d.getMinutes() + sec / 60) / 60) * Math.PI * 2;
        hands[0].rotation.z = -(((d.getHours() % 12) + d.getMinutes() / 60) / 12) * Math.PI * 2;
        lens.position.x = Math.sin(t * 0.5) * 0.04 * mo + 0.02;
        lens.position.z = Math.cos(t * 0.5) * 0.04 * mo;
        led.visible = Math.floor(t * 1.6) % 2 === 0;
        mwLed.visible = Math.floor(t * 0.9) % 3 !== 0;

        docs.forEach((dd) => (dd.visible = false));
        flights.slice(0, docs.length).forEach((f, i) => placeDoc(docs[i], f.from, f.to, f.p, agents[f.from].color));

        screenClock += dt; clockT += dt;
        if (screenClock > 1 / 12) { screenClock = 0; drawScreens(clockT); drawBoard(); }

        if (composer) composer.render(dt);
        else renderer.render(scene, camera);
        if (onFrame) onFrame(dt);
      }

      function projectLabel(id) {
        stations[id].bot.head.getWorldPosition(headW);
        headW.y += id === 'orchestrator' ? 0.5 : 0.42;
        headW.project(camera);
        return { x: ((headW.x + 1) / 2) * W, y: ((1 - headW.y) / 2) * Hh, behind: headW.z > 1 };
      }

      resize();
      new ResizeObserver(resize).observe(canvas);
      raf = requestAnimationFrame(frame);

      return {
        focus,
        resetView,
        // cancel the queued frame too: a hidden page keeps it pending, and a second loop would start on resume
        pause() { running = false; cancelAnimationFrame(raf); },
        resume() { if (running) return; running = true; last = performance.now() / 1000; raf = requestAnimationFrame(frame); },
        setTheme,
        setStates(map) { for (const [id, s] of Object.entries(map)) if (stations[id]) stations[id].state = s; },
        setFlights(list) { flights = list; },
        setCounters(map) {
          for (const [id, k] of Object.entries(map)) {
            const st = stations[id];
            if (!st || !st.counterCv) continue;
            const key = `${k.tools}/${k.web}/${k.files}`;
            if (key !== st.countsKey) { st.countsKey = key; st.counts = { ...k }; drawCounter(st); }
          }
        },
        setWall(info) { wallInfo = info; drawWall(); },
        // queue the manager to walk over and brief an agent ('publish' sends it back to its spot)
        cue(id) { const b = stations.orchestrator; if (!b.queue.includes(id) && b.target !== id) b.queue.push(id); },
        resetCues() { const b = stations.orchestrator; b.queue = []; },
        // everyone back at their spot: agents seated, the manager home with nothing queued
        settled() {
          return Object.values(stations).every((s) => (s.id === 'orchestrator'
            ? s.mode === 'home' && !s.queue.length
            : s.mode === 'seated' && s.sit > 0.9));
        },
        projectLabel,
        set onFrame(fn) { onFrame = fn; },
        get selected() { return selectedId; },
        dispose() { running = false; cancelAnimationFrame(raf); renderer.dispose(); },
        _debug: { camera, controls, stations, docs, hq, scene },
      };
    }

    return createOffice;
  })());
}

// ---- tab state --------------------------------------------------------------------------------
const O = {
  office: null, booting: false, stage: null, canvas: null, labels: null, card: null, msg: null, bubble: null,
  tags: {}, says: {}, refs: {}, run: null, runs: [], appliedId: undefined, ctx: null, dark: false,
  attached: false, visible: true, userPaused: false, selected: null,
  elapsed: 0, lastNow: 0, prev: {}, published: false, bubbleUntil: 0, cursors: {}, lastT: -1, latest: null, statusKey: "",
};
const stat = (id) => (O.run && O.run.agents[id]) || null;

function buildStage() {
  const st = document.createElement("div");
  st.className = "of-stage";
  st.innerHTML = `<canvas class="of-canvas" aria-label="3D office: the orchestrator and four subagents replaying the selected run"></canvas>
    <div class="of-labels off"></div>
    <div class="of-msg" role="status" hidden></div>
    <aside class="of-agent" role="dialog" aria-label="Agent details" hidden></aside>`;
  O.stage = st;
  O.canvas = st.querySelector("canvas");
  O.labels = st.querySelector(".of-labels");
  O.msg = st.querySelector(".of-msg");
  O.card = st.querySelector(".of-agent");
  for (const id of META.order) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "of-tag";
    b.dataset.id = id;
    b.style.setProperty("--c", colorOf(id));
    b.innerHTML = `<i></i>${esc(nameOf(id))}`;
    b.addEventListener("click", () => select(O.selected === id ? null : id));
    O.labels.append(b);
    O.tags[id] = b;
    const s = document.createElement("div");
    s.className = "of-say";
    s.hidden = true;
    s.style.setProperty("--c", colorOf(id));
    O.labels.append(s);
    O.says[id] = s;
  }
  O.bubble = document.createElement("div");
  O.bubble.className = "of-bubble";
  O.bubble.hidden = true;
  O.labels.append(O.bubble);
  O.card.addEventListener("click", (e) => { if (e.target.closest(".of-x")) select(null); });
  new IntersectionObserver((es) => { O.visible = es[0].isIntersecting; syncLoop(); }).observe(st);
}

function showMsg(text) { O.msg.textContent = text || ""; O.msg.hidden = !text; }

async function ensureScene() {
  if (O.office || O.booting) return;
  O.booting = true;
  showMsg("Loading the office…");
  try {
    const createOffice = await loadScene();
    O.office = createOffice(O.canvas, {
      agents: META.agents,
      onPick: (id) => select(id || null),
      onHover: (id) => { for (const [k, t] of Object.entries(O.tags)) t.classList.toggle("on", k === id || k === O.selected); },
    });
    O.office.onFrame = onFrame;
    O.office.setTheme(O.dark);
    applyRun(true);
    syncLoop();
  } catch (e) {
    console.error(e);
    scenePromise = null;
    showMsg("Couldn't load the 3D office. It needs cdn.jsdelivr.net; the numbers below still work.");
  } finally {
    O.booting = false;
  }
}

// render only while the tab is open, the office is on screen and the user hasn't paused it
function syncLoop() {
  if (!O.office) return;
  if (O.attached && O.visible && !O.userPaused && !document.hidden) { O.lastNow = 0; O.office.resume(); }
  else O.office.pause();
}
document.addEventListener("visibilitychange", syncLoop);

function applyRun(force) {
  if (!O.office) return;
  const id = O.run ? O.run.run_id : null;
  if (!force && id === O.appliedId) return;
  O.appliedId = id;
  O.elapsed = 0; O.prev = {}; O.published = false; O.cursors = {}; O.lastT = -1; O.latest = null; O.bubbleUntil = 0;
  O.office.resetCues();
  Object.values(O.says).forEach((s) => (s.hidden = true));
  O.bubble.hidden = true;
  if (!O.run) {
    O.office.setStates(Object.fromEntries(META.order.map((k) => [k, "waiting"])));
    O.office.setFlights([]);
    return;
  }
  const t = O.run.totals;
  O.office.setWall({
    title: O.run.run_id,
    lines: [fmtTok(t.tokens) + " tokens", fmtUsd(t.cost_usd) + " API-equivalent", fmtDur(O.run.wall_s) + " wall time",
      t.tool_calls + " tool calls", fmtUsd(t.cache_saved_usd) + " saved by caching"],
  });
  if (O.selected) renderCard(O.selected);
}

// ---- agent card ---------------------------------------------------------------------------
function renderCard(id) {
  const a = META.agents[id], s = stat(id);
  const box = (k, v) => `<div><span>${k}</span><b>${v}</b></div>`;
  let body = "";
  if (s) {
    const sp = s.cost_split || {};
    const total = Object.values(sp).reduce((x, y) => x + y, 0) || 1;
    body = `<div class="of-stats">${box("Tokens", fmtTok(s.tokens.total))}${box("Cost", fmtUsd(s.cost_usd))}${box("Time", fmtDur(s.duration_s))}${box("Requests", s.requests)}${box("Tool calls", s.tool_calls)}${box("Web", `${s.web_searches}s · ${s.web_fetches}f`)}</div>
      <div class="of-bar">${TYPES.map(([k, , c]) => `<i style="width:${((sp[k] || 0) / total) * 100}%;background:${c}"></i>`).join("")}</div>
      <ul class="of-split">${TYPES.map(([k, label, c]) => `<li><i class="of-sw" style="background:${c}"></i>${label} ${fmtTok(s.tokens[k])}<span>${fmtUsd(sp[k])}</span></li>`).join("")}</ul>
      <p class="of-foot">Input and cache tokens are exact. Output is estimated from visible text, so costs are approximate and use API list prices, not your subscription.</p>`;
  } else body = `<p class="of-foot">No stats for this agent in this run.</p>`;
  O.card.style.setProperty("--c", a.color);
  O.card.innerHTML = `<button class="of-x" type="button" aria-label="Close agent details">×</button>
    <div class="of-agent-h"><i></i><div><span class="eyebrow">${esc(a.step)}</span><h3>${esc(a.name)}</h3></div></div>
    <p class="of-goal">${esc(a.goal)}</p><p class="of-desc">${esc(a.description)}</p>
    <dl class="of-kv"><dt>Scope</dt><dd>${esc(a.scope)}</dd><dt>Reads</dt><dd>${esc(a.inputs)}</dd><dt>Writes</dt><dd>${esc(a.outputs)}</dd>${s ? `<dt>Model</dt><dd>${esc(s.model)}</dd>` : ""}</dl>${body}`;
}

function select(id) {
  O.selected = id;
  const host = O.stage.closest(".of-card");
  if (host) host.classList.toggle("of-picked", !!id);
  if (id) {
    renderCard(id);
    O.card.hidden = false;
    const wide = O.stage.clientWidth > 560;
    if (O.office) O.office.focus(id, wide ? { x: 170, y: 0 } : { x: 0, y: O.stage.clientHeight * 0.2 });
  } else {
    O.card.hidden = true;
    if (O.office) O.office.focus(null);
  }
  for (const [k, t] of Object.entries(O.tags)) {
    t.classList.toggle("on", k === id);
    t.classList.toggle("dim", !!id && k !== id);
  }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && O.attached && O.selected) select(null); });

// ---- per frame: labels, replay clock, bubbles, pipeline, status -----------------------------------
function place(node, p, dy, W) {
  const half = node.offsetWidth / 2 + 8;
  const x = Math.min(Math.max(p.x, half), W - half);
  node.style.transform = `translate(${x.toFixed(1)}px, ${(p.y - dy).toFixed(1)}px) translate(-50%, -100%)`;
}

function phrase(ev) {
  const [, kind, detail] = ev;
  if (kind === "agent") return `Launching ${META.agents[detail] ? nameOf(detail) : "an agent"}`;
  return (PHRASES[kind] || PHRASES.tool)(detail);
}

function say(text) {
  O.bubble.textContent = text;
  O.bubbleUntil = performance.now() / 1000 + 3.2;
  O.latest = { id: "orchestrator", text };
}

function onFrame() {
  const office = O.office, W = O.stage.clientWidth;
  if (O.labels.classList.contains("off")) { O.labels.classList.remove("off"); showMsg(""); } // first frame drawn
  for (const id of META.order) {
    const p = office.projectLabel(id), tag = O.tags[id];
    tag.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px) translate(-50%, -100%)`;
    tag.style.visibility = p.behind ? "hidden" : "visible";
  }
  const now = performance.now() / 1000;
  const dt = O.lastNow ? Math.min(0.25, now - O.lastNow) : 0;
  O.lastNow = now;
  const run = O.run;
  if (!run) { setStatus("orchestrator", O.ctx && O.ctx.stats == null ? "Loading the run…" : "No stats for this run yet"); return; }
  // a replay starts (or restarts) only once everyone is back at their desk
  const cycle = LOOP_S + HOLD_S, settled = office.settled();
  let regroup = false;
  if (O.elapsed > 0 || settled) O.elapsed += dt; else regroup = true;
  if (O.elapsed >= cycle) {
    if (settled) O.elapsed -= cycle;
    else { O.elapsed = cycle - 1e-3; regroup = true; }
  }
  const wall = run.wall_s;
  const e = O.elapsed;
  const t = Math.min(wall, (e / LOOP_S) * wall);
  const holding = e > LOOP_S;

  const st = {};
  for (const id of META.order) {
    const s = run.agents[id];
    if (!s) { st[id] = "waiting"; continue; }
    if (id === "orchestrator") st[id] = holding ? "done" : "working";
    else st[id] = t < s.start_offset_s ? "waiting" : t < s.start_offset_s + s.duration_s ? "working" : "done";
  }
  office.setStates(st);

  // the manager briefs each agent as it starts, then announces the publish
  const started = Object.keys(st).filter((id) => id !== "orchestrator" && st[id] === "working" && O.prev[id] !== "working");
  if (started.length) {
    say(started.length > 1 ? started.map(nameOf).join(" & ") + ": go, in parallel." : ORDERS[started[0]]);
    started.forEach((id) => office.cue(id));
  }
  const synthDone = st.synthesis === "done";
  if (synthDone && !O.published) { say(ORDERS.publish); office.cue("publish"); O.published = true; }
  if (!synthDone) O.published = false;
  O.prev = st;

  const bp = office.projectLabel("orchestrator");
  O.bubble.hidden = now > O.bubbleUntil || bp.behind;
  if (!O.bubble.hidden) place(O.bubble, bp, 36, W);

  // what each agent is doing right now, from its recorded tool calls; narrow stages use the status pill only
  const narrow = W < 640;
  if (t < O.lastT) { O.cursors = {}; O.latest = null; }
  O.lastT = t;
  const counts = {};
  for (const id of META.order) {
    const events = (run.agents[id] && run.agents[id].events) || [];
    const c = O.cursors[id] || (O.cursors[id] = { i: 0, counts: { tools: 0, web: 0, files: 0 }, shown: -1, shownAt: 0, until: 0 });
    while (c.i < events.length && events[c.i][0] <= t) {
      const kind = events[c.i][1];
      c.counts.tools++;
      if (WEB.has(kind)) c.counts.web++;
      if (FILES.has(kind) && kind !== "read") c.counts.files++;
      c.i++;
    }
    counts[id] = c.counts;
    const b = O.says[id];
    if (!holding && c.i > 0 && c.i - 1 !== c.shown && now - c.shownAt > 1.3) { // at most every 1.3 s so it can be read
      c.shown = c.i - 1;
      c.shownAt = now;
      c.until = now + 2.2;
      b.textContent = phrase(events[c.shown]);
      if (!(id === "orchestrator" && now < O.bubbleUntil)) O.latest = { id, text: b.textContent };
    }
    const p = office.projectLabel(id);
    const hide = narrow || now > c.until || p.behind || (id === "orchestrator" && !O.bubble.hidden);
    b.hidden = hide;
    if (!hide) place(b, p, 36, W);
  }
  office.setCounters(counts);

  const flights = [];
  for (const [from, to] of EDGES) {
    const a = run.agents[from], b = run.agents[to];
    if (!a || !b) continue;
    const end = a.start_offset_s + a.duration_s;
    const begin = end - 0.01 * wall;
    const arrive = Math.max(b.start_offset_s, begin + 0.07 * wall);
    const p = (t - begin) / (arrive - begin);
    if (p > 0 && p < 1 && !holding) flights.push({ from, to, p });
  }
  office.setFlights(flights);
  for (const [id, tag] of Object.entries(O.tags)) tag.dataset.state = st[id];

  if (regroup) setStatus("orchestrator", holding ? "Run complete · next replay once everyone is back at their desk" : "Getting everyone back to their desks");
  else if (holding) setStatus("orchestrator", "Run complete · published to the app");
  else if (O.latest) setStatus(O.latest.id, O.latest.text);
  else setStatus("orchestrator", "Starting the run");

  const r = O.refs;
  if (r.playhead) r.playhead.style.left = `calc(96px + (100% - 96px) * ${(t / wall).toFixed(4)})`;
  if (r.clock) r.clock.textContent = `${fmtDur(t)} / ${fmtDur(wall)} · replay ${Math.round(wall / LOOP_S)}×`;
  if (r.pipe) renderPipe(t);
}

function setStatus(id, text) {
  const key = id + "|" + text, el = O.refs.status;
  if (!el || el.dataset.k === key) return;
  el.dataset.k = key;
  el.style.setProperty("--c", colorOf(id));
  el.querySelector("b").textContent = nameOf(id);
  el.querySelector("span").textContent = text;
}

function renderPipe(t) {
  const html = META.pipeline.map((s, i) => {
    const ids = s.id === "publish" ? [] : [s.id, s.parallel].filter(Boolean);
    let state = "";
    if (s.id === "publish") { const y = stat("synthesis"); state = y && t >= y.start_offset_s + y.duration_s ? "on" : ""; }
    else {
      const ss = ids.map(stat).filter(Boolean);
      if (ss.length) {
        const started = ss.some((x) => t >= x.start_offset_s);
        const done = ss.every((x) => t >= x.start_offset_s + x.duration_s);
        state = done ? "done" : started ? "on" : "";
      }
    }
    const label = ids.length > 1 ? `${nameOf(ids[0])} ‖ ${nameOf(ids[1])}` : s.label;
    const c = ids[0] ? colorOf(ids[0]) : "var(--accent)";
    return `${i ? '<li class="sep">›</li>' : ""}<li class="${state}" style="--c:${c}">${label}</li>`;
  }).join("");
  if (O.refs.pipe.dataset.h !== html) { O.refs.pipe.dataset.h = html; O.refs.pipe.innerHTML = html; }
}

// ---- tab markup -----------------------------------------------------------------------------------
function tiles(run) {
  const t = run.totals;
  const tile = (k, v, sub) => `<div class="glass of-tile"><span>${k}</span><b>${v}</b><small>${sub}</small></div>`;
  return `<section class="of-tiles">${tile("Tokens", fmtTok(t.tokens), `${t.requests} model requests`)}${tile("Cost", fmtUsd(t.cost_usd), "API list prices, approximate")}${tile("Wall time", fmtDur(run.wall_s), `${t.tool_calls} tool calls`)}${tile("Saved by cache", fmtUsd(t.cache_saved_usd), `${fmtTok(t.cache_read)} cache reads`)}</section>`;
}

function timeline(run) {
  const rows = ROWS.map((id) => {
    const s = run.agents[id];
    const bar = s ? `<i style="--c:${colorOf(id)};left:${(s.start_offset_s / run.wall_s) * 100}%;width:${Math.max(0.8, (s.duration_s / run.wall_s) * 100)}%" title="${esc(nameOf(id))}: ${fmtDur(s.duration_s)}"></i>` : "";
    return `<div class="of-tl-row"><span>${esc(nameOf(id))}</span>${bar}</div>`;
  }).join("");
  return `<section class="glass card"><div class="sec-h"><h2>Run replay</h2><span class="muted mono" id="ofClock"></span></div>
    <ol class="of-pipe" id="ofPipe"></ol><div class="of-tl">${rows}<div class="of-playhead" id="ofPlayhead"></div></div></section>`;
}

function costSplit(run) {
  const rows = ROWS.filter((id) => run.agents[id]);
  const max = Math.max(...rows.map((id) => run.agents[id].cost_usd || 0), 0.0001);
  return `<section class="glass card"><div class="sec-h"><h2>Where the cost goes</h2><span class="muted">By agent and token type</span></div>
    <div class="of-sc">${rows.map((id) => {
      const sp = run.agents[id].cost_split || {};
      return `<div class="of-sc-row"><span>${esc(nameOf(id))}</span><div class="of-bar">${TYPES.map(([k, label, c]) => `<i style="width:${((sp[k] || 0) / max) * 100}%;background:${c}" title="${label} ${fmtUsd(sp[k])}"></i>`).join("")}</div></div>`;
    }).join("")}</div>
    <ul class="of-legend">${TYPES.map(([, label, c]) => `<li><i class="of-sw" style="background:${c}"></i>${label}</li>`).join("")}</ul></section>`;
}

function compare(runs, cur) {
  const max = Math.max(...runs.map((r) => r.totals.cost_usd || 0), 0.0001);
  const delta = (a, b, what) => {
    if (!b) return "";
    const pct = ((a - b) / b) * 100;
    return `${pct > 0 ? "+" : pct < 0 ? "−" : "±"}${Math.abs(pct).toFixed(0)}% ${what}`;
  };
  const rows = runs.map((r, i) => {
    const prev = runs[i + 1]; // newest first
    const segs = ROWS.filter((id) => r.agents[id]).map((id) => {
      const a = r.agents[id];
      return `<i style="width:${((a.cost_usd || 0) / max) * 100}%;background:${colorOf(id)}" title="${esc(nameOf(id))} ${fmtUsd(a.cost_usd)} · ${fmtTok(a.tokens.total)} tokens · ${fmtDur(a.duration_s)}"></i>`;
    }).join("");
    return `<button class="of-cmp-row ${r.run_id === cur ? "cur" : ""}" type="button" data-of-run="${esc(r.run_id)}">
      <span class="of-cmp-when">${esc(fmtWhen(r.run_at))}</span><span class="of-cmp-bar">${segs}</span>
      <span class="of-cmp-nums"><b>${fmtUsd(r.totals.cost_usd)}</b> · ${fmtTok(r.totals.tokens)} tok · ${fmtDur(r.wall_s)}<br>${prev ? `${delta(r.totals.cost_usd, prev.totals.cost_usd, "cost")} · ${delta(r.wall_s, prev.wall_s, "time")}` : "first run with stats"}</span></button>`;
  }).join("");
  const table = `<thead><tr><th>Agent</th>${runs.map((r) => `<th>${esc(fmtWhen(r.run_at))}</th>`).join("")}</tr></thead><tbody>` +
    ROWS.map((id) => `<tr><th>${esc(nameOf(id))}</th>${runs.map((r) => {
      const a = r.agents[id];
      return `<td>${a ? `${fmtUsd(a.cost_usd)}<br><small>${fmtTok(a.tokens.total)} · ${fmtDur(a.duration_s)}</small>` : "—"}</td>`;
    }).join("")}</tr>`).join("") +
    `<tr class="tot"><th>Total</th>${runs.map((r) => `<td>${fmtUsd(r.totals.cost_usd)}</td>`).join("")}</tr></tbody>`;
  return `<section class="glass card"><div class="sec-h"><h2>Compare runs</h2><span class="muted">Cost by agent, one scale. Pick a run to replay it.</span></div>
    <ul class="of-legend" style="margin:0 0 10px">${ROWS.map((id) => `<li><i class="of-sw" style="background:${colorOf(id)}"></i>${esc(nameOf(id))}</li>`).join("")}</ul>
    <div class="of-cmp">${rows}</div>
    <details class="of-table"><summary>Table view</summary><div><table>${table}</table></div></details></section>`;
}

function view(ctx) {
  O.ctx = ctx;
  O.dark = !!ctx.dark;
  const list = ctx.stats || [];
  const exact = list.find((d) => d.run_id === ctx.runId) || null;
  O.run = exact || list[0] || null;
  O.runs = list;
  const run = O.run;
  const note = ctx.stats == null ? "" : !run ? "No agent stats yet" : !exact ? `No stats for this review · showing ${fmtDay(run.run_at)}` : "";
  const card = `<section class="glass of-card">
    <div class="of-slot" id="ofSlot"></div>
    <div class="of-head">
      <span class="eyebrow">Office${run ? " · " + esc(fmtDay(run.run_at)) : ""}</span>
      <div class="of-tools"><button class="of-btn" type="button" data-of="reset">Reset view</button><button class="of-btn" type="button" data-of="pause" aria-pressed="${O.userPaused}">${O.userPaused ? "Play" : "Pause"}</button></div>
      <h2 class="of-title"><span class="tone">Five agents,</span>one run</h2>${note ? `<span class="of-note">${esc(note)}</span>` : ""}
    </div>
    <div class="of-status" id="ofStatus" aria-live="polite"><i></i><div><b></b><span></span></div></div>
  </section>`;
  if (!run) {
    const empty = ctx.stats == null ? "" : `<section class="glass card"><div class="sec-h"><h2>No agent stats yet</h2></div><p class="muted">Step 5 of <code>/linkedin-review</code> runs <code>scripts/agent_stats.py</code> and publishes the numbers here.</p></section>`;
    return `<div style="display:flex;flex-direction:column;gap:18px">${card}${empty}</div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:18px">${card}${tiles(run)}${timeline(run)}
    <div class="grid2">${costSplit(run)}${compare(list, run.run_id)}</div>
    <p class="muted" style="font-size:.78rem">Input and cache tokens are exact; output tokens are estimated from visible text, so costs are approximate API list prices, not your subscription. Tool calls show only their kind, a website host or a file name.</p></div>`;
}

function attach() {
  const slot = document.getElementById("ofSlot");
  if (!slot) return;
  if (!O.stage) buildStage();
  slot.append(O.stage);
  O.refs = { status: document.getElementById("ofStatus"), pipe: document.getElementById("ofPipe"), playhead: document.getElementById("ofPlayhead"), clock: document.getElementById("ofClock") };
  O.attached = true;
  if (O.office) { O.office.setTheme(O.dark); applyRun(false); }
  ensureScene();
  syncLoop();
}

function detach() {
  if (!O.attached) return;
  O.attached = false;
  if (O.selected) select(null);
  syncLoop();
}

document.addEventListener("click", (e) => {
  if (!O.attached) return;
  const b = e.target.closest("[data-of]");
  if (b && b.dataset.of === "reset") { select(null); if (O.office) O.office.resetView(); return; }
  if (b && b.dataset.of === "pause") {
    O.userPaused = !O.userPaused;
    b.textContent = O.userPaused ? "Play" : "Pause";
    b.setAttribute("aria-pressed", String(O.userPaused));
    syncLoop();
    return;
  }
  const row = e.target.closest("[data-of-run]");
  if (row && O.ctx && O.ctx.onPickRun) O.ctx.onPickRun(row.dataset.ofRun);
});

window.LROffice = {
  view, attach, detach,
  setTheme(d) { O.dark = d; if (O.office) O.office.setTheme(d); },
};
})();
</script>
