<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A flowchart showing the four-stage Claude Code agent pipeline: a scraper agent extracts a LinkedIn profile into a cached JSON file, career-coach and recruiter agents analyze it independently in parallel, a synthesis agent merges their findings, and generate_pdf.py renders the final PDF report.</desc>
